<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Last Territory</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #f4f1eb;
      color: #1c1c1c;
    }

    section {
      padding: 100px 10%;
    }

    .hero {
      background: #111;
      color: white;
      height: 80vh;
      display: flex;
      align-items: center;
    }

    .hero h1 {
      font-size: 60px;
      margin-bottom: 20px;
    }

    .map-container {
      display: flex;
      justify-content: center;
    }

    svg {
      width: 80%;
      height: 500px;
    }

    h2 {
      margin-bottom: 40px;
    }
  </style>
</head>

<body>

<section class="hero">
  <div>
    <h1>The Last Territory</h1>
    <p>How highways reshaped the survival of the Florida panther.</p>
  </div>
</section>

<section>
  <h2>Last Refuge</h2>
  <div class="map-container">
    <svg id="floridaMap"></svg>
  </div>
</section>

<section>
  <h2>Road Mortality Over Time</h2>
  <svg id="lineGraph"></svg>
</section>

<script>

///////////////////////////
// FLORIDA MAP
///////////////////////////

d3.json("florida.geo.json").then(data => {

  const svg = d3.select("#floridaMap");
  const width = svg.node().clientWidth;
  const height = svg.node().clientHeight;

  const projection = d3.geoMercator()
    .fitSize([width, height], data);

  const path = d3.geoPath().projection(projection);

  svg.selectAll("path")
    .data(data.features)
    .enter()
    .append("path")
    .attr("d", path)
    .attr("fill", "#e6dccb")
    .attr("stroke", "#999");

});


///////////////////////////
// LINE GRAPH
///////////////////////////

const mortalityData = [
  {year: 2002, deaths: 12},
  {year: 2005, deaths: 20},
  {year: 2010, deaths: 23},
  {year: 2016, deaths: 32},
  {year: 2022, deaths: 27}
];

const svg = d3.select("#lineGraph");
const width = svg.node().clientWidth;
const height = 500;

svg.attr("height", height);

const x = d3.scaleLinear()
  .domain(d3.extent(mortalityData, d => d.year))
  .range([60, width - 40]);

const y = d3.scaleLinear()
  .domain([0, d3.max(mortalityData, d => d.deaths)])
  .range([height - 60, 40]);

svg.append("g")
  .attr("transform", `translate(0, ${height - 60})`)
  .call(d3.axisBottom(x).tickFormat(d3.format("d")));

svg.append("g")
  .attr("transform", "translate(60,0)")
  .call(d3.axisLeft(y));

const line = d3.line()
  .x(d => x(d.year))
  .y(d => y(d.deaths));

svg.append("path")
  .datum(mortalityData)
  .attr("fill", "none")
  .attr("stroke", "#c62828")
  .attr("stroke-width", 4)
  .attr("d", line);

</script>

</body>
</html>
