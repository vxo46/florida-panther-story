<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Florida Panther Survival</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://unpkg.com/scrollama"></script>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<section class="hero">
  <img src="panther.jpg" alt="Florida Panther">
  <h1>Mapping the Survival of the Florida Panther</h1>
</section>

<main class="container">

<div class="scrolly">

  <div class="sticky">
    <div id="heatmap"></div>
  </div>

  <div class="steps">

    <div class="step" data-year="1975">
      <p>In the 1970s, fewer than 30 panthers remained in Florida.</p>
    </div>

    <div class="step" data-year="1995">
      <p>Conservation efforts began to stabilize the population.</p>
    </div>

    <div class="step" data-year="2010">
      <p>Vehicle collisions increased as development expanded.</p>
    </div>

    <div class="step" data-year="2020">
      <p>Today, panthers survive mostly in fragmented South Florida habitat.</p>
    </div>

  </div>

</div>

</main>

<script src="script.js"></script>
</body>
</html>
